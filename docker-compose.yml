version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sge_ifce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sge_ifce"]
      interval: 5s
      timeout: 5s
      retries: 5

  # C# .NET 6.0 Web API (SGE-IFCE Backend)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: 5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=sge_ifce;Username=postgres;Password=postgrespassword;SSL Mode=Prefer;Trust Server Certificate=true"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # React / Vite Frontend (SGE-IFCE Dashboard)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
